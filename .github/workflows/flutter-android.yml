name: Flutter Android CI

on:
  push:
    branches: [ main, staging ]
    paths:
      - 'tindahan_natin/**'
      - '!tindahan_natin/lib/features/public_store/**'
  # pull_request:
  #   branches: [ main ]
  #   paths:
  #     - 'tindahan_natin/**'
  #     - '!tindahan_natin/lib/features/public_store/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Required for WIF auth

    steps:
      - uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set Environment Variables
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV_NAME="prod"
            SERVICE_NAME="tindahannatin-server"
            echo "PUBLIC_WEB_APP_BASE_URL=${{ secrets.PROD_PUBLIC_WEB_APP_BASE_URL || secrets.PUBLIC_WEB_APP_BASE_URL }}" >> $GITHUB_ENV
            echo "AUTH0_DOMAIN=${{ secrets.PROD_AUTH0_DOMAIN || secrets.AUTH0_DOMAIN }}" >> $GITHUB_ENV
            echo "AUTH0_CLIENT_ID=${{ secrets.PROD_AUTH0_CLIENT_ID || secrets.AUTH0_CLIENT_ID }}" >> $GITHUB_ENV
            echo "AUTH0_AUDIENCE=${{ secrets.PROD_AUTH0_AUDIENCE || secrets.AUTH0_AUDIENCE }}" >> $GITHUB_ENV
            echo "AUTH0_SCHEME=${{ secrets.PROD_AUTH0_SCHEME || secrets.AUTH0_SCHEME }}" >> $GITHUB_ENV
            echo "PLAY_TRACK=production" >> $GITHUB_ENV
          else
            ENV_NAME="staging"
            SERVICE_NAME="tindahannatin-server-staging"
            echo "PUBLIC_WEB_APP_BASE_URL=${{ secrets.STAGING_PUBLIC_WEB_APP_BASE_URL || secrets.PUBLIC_WEB_APP_BASE_URL }}" >> $GITHUB_ENV
            echo "AUTH0_DOMAIN=${{ secrets.STAGING_AUTH0_DOMAIN || secrets.AUTH0_DOMAIN }}" >> $GITHUB_ENV
            echo "AUTH0_CLIENT_ID=${{ secrets.STAGING_AUTH0_CLIENT_ID || secrets.AUTH0_CLIENT_ID }}" >> $GITHUB_ENV
            echo "AUTH0_AUDIENCE=${{ secrets.STAGING_AUTH0_AUDIENCE || secrets.AUTH0_AUDIENCE }}" >> $GITHUB_ENV
            echo "AUTH0_SCHEME=${{ secrets.STAGING_AUTH0_SCHEME || secrets.AUTH0_SCHEME }}" >> $GITHUB_ENV
            echo "PLAY_TRACK=alpha" >> $GITHUB_ENV
          fi
          
          # Query the URL dynamically from Cloud Run
          RUN_URL=$(gcloud run services describe $SERVICE_NAME --platform managed --region asia-southeast1 --format 'value(status.url)' 2>/dev/null || echo "")
          
          if [ -n "$RUN_URL" ]; then
            echo "SERVER_HTTP=$RUN_URL" >> $GITHUB_ENV
            echo "Resolved Cloud Run URL: $RUN_URL"
          else
            # Fallback to secrets if lookup failed
            FALLBACK_HTTP="${{ secrets.STAGING_SERVER_HTTP || secrets.SERVER_HTTP }}"
            if [ "$ENV_NAME" = "prod" ]; then
              FALLBACK_HTTP="${{ secrets.PROD_SERVER_HTTP || secrets.SERVER_HTTP }}"
            fi
            echo "SERVER_HTTP=$FALLBACK_HTTP" >> $GITHUB_ENV
            echo "Cloud Run service not found or lookup failed. Using fallback: $FALLBACK_HTTP"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        working-directory: tindahan_natin

      - name: Generate Code
        run: flutter pub run build_runner build --delete-conflicting-outputs
        working-directory: tindahan_natin
      
      - name: Generate Icons
        run: flutter pub run flutter_launcher_icons
        working-directory: tindahan_natin

      - name: Extract version
        id: extract_version
        run: |
          VERSION=$(grep 'version: ' pubspec.yaml | sed 's/version: //')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        working-directory: tindahan_natin

      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties
        working-directory: tindahan_natin

      - name: Extract Release Notes
        id: release_notes
        run: |
          awk '/^## \[/{if (count++) exit; next} count' CHANGELOG.md > release_notes.txt
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        working-directory: tindahan_natin

      - name: Prepare Google Play Release Notes
        run: |
          mkdir -p google-play-notes/whatsnew
          head -c 500 release_notes.txt > google-play-notes/whatsnew/whatsnew-en-US
        working-directory: tindahan_natin

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=SERVER_HTTP=${{ env.SERVER_HTTP }} \
            --dart-define=PUBLIC_WEB_APP_BASE_URL=${{ env.PUBLIC_WEB_APP_BASE_URL }} \
            --dart-define=AUTH0_DOMAIN=${{ env.AUTH0_DOMAIN }} \
            --dart-define=AUTH0_CLIENT_ID=${{ env.AUTH0_CLIENT_ID }} \
            --dart-define=AUTH0_AUDIENCE=${{ env.AUTH0_AUDIENCE }} \
            --dart-define=AUTH0_SCHEME=${{ env.AUTH0_SCHEME }} \
            --dart-define=BANNER_AD_UNIT_ID_ANDROID=${{ secrets.BANNER_AD_UNIT_ID_ANDROID }} \
            --dart-define=INTERSTITIAL_AD_UNIT_ID_ANDROID=${{ secrets.INTERSTITIAL_AD_UNIT_ID_ANDROID }} \
            --dart-define=NATIVE_AD_UNIT_ID_ANDROID=${{ secrets.NATIVE_AD_UNIT_ID_ANDROID }}
        working-directory: tindahan_natin
        env:
          AUTH0_DOMAIN: ${{ env.AUTH0_DOMAIN }}
          AUTH0_SCHEME: ${{ env.AUTH0_SCHEME }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}

      - name: Build App Bundle
        run: |
          flutter build appbundle --release \
            --dart-define=SERVER_HTTP=${{ env.SERVER_HTTP }} \
            --dart-define=PUBLIC_WEB_APP_BASE_URL=${{ env.PUBLIC_WEB_APP_BASE_URL }} \
            --dart-define=AUTH0_DOMAIN=${{ env.AUTH0_DOMAIN }} \
            --dart-define=AUTH0_CLIENT_ID=${{ env.AUTH0_CLIENT_ID }} \
            --dart-define=AUTH0_AUDIENCE=${{ env.AUTH0_AUDIENCE }} \
            --dart-define=AUTH0_SCHEME=${{ env.AUTH0_SCHEME }} \
            --dart-define=BANNER_AD_UNIT_ID_ANDROID=${{ secrets.BANNER_AD_UNIT_ID_ANDROID }} \
            --dart-define=INTERSTITIAL_AD_UNIT_ID_ANDROID=${{ secrets.INTERSTITIAL_AD_UNIT_ID_ANDROID }} \
            --dart-define=NATIVE_AD_UNIT_ID_ANDROID=${{ secrets.NATIVE_AD_UNIT_ID_ANDROID }}
        working-directory: tindahan_natin
        env:
          AUTH0_DOMAIN: ${{ env.AUTH0_DOMAIN }}
          AUTH0_SCHEME: ${{ env.AUTH0_SCHEME }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: tindahan_natin/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: tindahan_natin/build/app/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.extract_version.outputs.VERSION }}
          body: ${{ steps.release_notes.outputs.NOTES }}
          files: |
            tindahan_natin/build/app/outputs/flutter-apk/app-release.apk
            tindahan_natin/build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Google Play
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONSOLE_SERVICE_ACCOUNT_JSON }}
          packageName: com.aebibtech.tindahan_natin
          releaseFiles: tindahan_natin/build/app/outputs/bundle/release/app-release.aab
          whatsNewDirectory: tindahan_natin/google-play-notes/whatsnew
          tracks: ${{ env.PLAY_TRACK }}
          status: completed
