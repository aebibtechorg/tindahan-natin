name: Build and Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'TindahanNatin.Server/**'
      - 'terraform/**'
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: asia-southeast1
  IMAGE_NAME: tindahannatin-server
  REPO_NAME: tindahannatin-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Google Auth
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
        service_account: ${{ secrets.GCP_WIF_SA }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker
      run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
      working-directory: ./terraform

    - name: Terraform Apply Infrastructure
      run: terraform apply -target=google_artifact_registry_repository.repo -target=cloudflare_r2_bucket.products -target=cloudflare_r2_bucket.backups -auto-approve
      working-directory: ./terraform
      env:
        TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
        TF_VAR_region: ${{ env.GCP_REGION }}
        TF_VAR_image_tag: ${{ github.sha }}
        TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        TF_VAR_postgres_connection_string: ${{ secrets.POSTGRES_CONNECTION_STRING }}
        TF_VAR_redis_connection_string: ${{ secrets.REDIS_CONNECTION_STRING }}
        TF_VAR_signalr_connection_string: ${{ secrets.SIGNALR_CONNECTION_STRING }}
        TF_VAR_r2_access_key: ${{ secrets.R2_ACCESS_KEY }}
        TF_VAR_r2_secret_key: ${{ secrets.R2_SECRET_KEY }}
        TF_VAR_auth0_domain: ${{ secrets.AUTH0_DOMAIN }}
        TF_VAR_auth0_audience: ${{ secrets.AUTH0_AUDIENCE }}
        TF_VAR_auth0_management_client_id: ${{ secrets.AUTH0_MANAGEMENT_CLIENT_ID }}
        TF_VAR_auth0_management_client_secret: ${{ secrets.AUTH0_MANAGEMENT_CLIENT_SECRET }}
        TF_VAR_auth0_client_id: ${{ secrets.AUTH0_CLIENT_ID }}
        TF_VAR_r2_bucket_name: ${{ secrets.R2_BUCKET_NAME }}
        TF_VAR_cors_allowed_origins: ${{ secrets.CORS_ALLOWED_ORIGINS }}

    - name: Publish Container
      run: |
        dotnet publish TindahanNatin.Server/TindahanNatin.Server.csproj \
          -c Release \
          -t:PublishContainer \
          -p:ContainerRegistry=${{ env.GCP_REGION }}-docker.pkg.dev \
          -p:ContainerRepository=${{ env.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }} \
          -p:ContainerImageTag=${{ github.sha }}

    - name: Install EF Tool
      run: dotnet tool install --global dotnet-ef

    - name: Database Backup
      run: |
        # Parse connection string to get PostgreSQL URI
        # Expecting: Host=myhost;Database=mydb;Username=myuser;Password=mypass
        # Or: Server=myhost;Database=mydb;User Id=myuser;Password=mypass
        # This is a bit fragile but common for .NET. 
        # For a more robust way, we'd use a dedicated script.
        
        CONN_STR="${{ secrets.POSTGRES_CONNECTION_STRING }}"
        
        extract_val() {
          echo "$CONN_STR" | grep -oEi "$1=[^;]+" | cut -d'=' -f2
        }
        
        HOST=$(extract_val "Host" || extract_val "Server")
        DB=$(extract_val "Database")
        USER=$(extract_val "Username" || extract_val "User Id")
        PASS=$(extract_val "Password")
        
        export PGPASSWORD="$PASS"
        BACKUP_FILE="backup-$(date +%Y%m%d%H%M%S).sql.gz"
        
        echo "Starting backup of $DB from $HOST..."
        pg_dump -h "$HOST" -U "$USER" -d "$DB" | gzip > "$BACKUP_FILE"
        
        echo "Uploading $BACKUP_FILE to R2..."
        # Use AWS CLI with R2 endpoint
        aws s3 cp "$BACKUP_FILE" "s3://${{ secrets.R2_BUCKET_NAME }}-backups/$BACKUP_FILE" \
          --endpoint-url "https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
          --region auto
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}

    - name: Update Database
      run: |
        dotnet ef database update \
          --project TindahanNatin.Server/TindahanNatin.Server.csproj \
          --connection "${{ secrets.POSTGRES_CONNECTION_STRING }}"

    - name: Terraform Apply
      run: terraform apply -auto-approve
      working-directory: ./terraform
      env:
        TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
        TF_VAR_region: ${{ env.GCP_REGION }}
        TF_VAR_image_tag: ${{ github.sha }}
        TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        TF_VAR_postgres_connection_string: ${{ secrets.POSTGRES_CONNECTION_STRING }}
        TF_VAR_redis_connection_string: ${{ secrets.REDIS_CONNECTION_STRING }}
        TF_VAR_signalr_connection_string: ${{ secrets.SIGNALR_CONNECTION_STRING }}
        TF_VAR_r2_access_key: ${{ secrets.R2_ACCESS_KEY }}
        TF_VAR_r2_secret_key: ${{ secrets.R2_SECRET_KEY }}
        TF_VAR_auth0_domain: ${{ secrets.AUTH0_DOMAIN }}
        TF_VAR_auth0_audience: ${{ secrets.AUTH0_AUDIENCE }}
        TF_VAR_auth0_management_client_id: ${{ secrets.AUTH0_MANAGEMENT_CLIENT_ID }}
        TF_VAR_auth0_management_client_secret: ${{ secrets.AUTH0_MANAGEMENT_CLIENT_SECRET }}
        TF_VAR_auth0_client_id: ${{ secrets.AUTH0_CLIENT_ID }}
        TF_VAR_r2_bucket_name: ${{ secrets.R2_BUCKET_NAME }}
        TF_VAR_cors_allowed_origins: ${{ secrets.CORS_ALLOWED_ORIGINS }}

