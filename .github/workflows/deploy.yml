name: Build and Deploy

on:
  push:
    branches: [ main, staging ]
    paths:
      - 'TindahanNatin.Server/**'
      - 'terraform/**'
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: asia-southeast1
  IMAGE_NAME: tindahannatin-server
  REPO_NAME: tindahannatin-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set Environment Variables
      run: |
        if [ "${{ github.ref }}" = "refs/heads/main" ]; then
          echo "ENV_NAME=prod" >> $GITHUB_ENV
          echo "REPO_NAME=tindahannatin-server" >> $GITHUB_ENV
          echo 'DB_CONN=${{ secrets.PROD_POSTGRES_CONNECTION_STRING || secrets.POSTGRES_CONNECTION_STRING }}' >> $GITHUB_ENV
          echo 'REDIS_CONN=${{ secrets.PROD_REDIS_CONNECTION_STRING || secrets.REDIS_CONNECTION_STRING }}' >> $GITHUB_ENV
          echo 'SIGNALR_CONN=${{ secrets.PROD_SIGNALR_CONNECTION_STRING || secrets.SIGNALR_CONNECTION_STRING }}' >> $GITHUB_ENV
          echo 'R2_BUCKET=${{ secrets.PROD_R2_BUCKET_NAME || secrets.R2_BUCKET_NAME }}' >> $GITHUB_ENV
          echo 'AUTH0_DOM=${{ secrets.PROD_AUTH0_DOMAIN || secrets.AUTH0_DOMAIN }}' >> $GITHUB_ENV
          echo 'AUTH0_AUD=${{ secrets.PROD_AUTH0_AUDIENCE || secrets.AUTH0_AUDIENCE }}' >> $GITHUB_ENV
          echo 'AUTH0_MGT_ID=${{ secrets.PROD_AUTH0_MANAGEMENT_CLIENT_ID || secrets.AUTH0_MANAGEMENT_CLIENT_ID }}' >> $GITHUB_ENV
          echo 'AUTH0_MGT_SEC=${{ secrets.PROD_AUTH0_MANAGEMENT_CLIENT_SECRET || secrets.AUTH0_MANAGEMENT_CLIENT_SECRET }}' >> $GITHUB_ENV
          echo 'AUTH0_CLIENT_ID=${{ secrets.PROD_AUTH0_CLIENT_ID || secrets.AUTH0_CLIENT_ID }}' >> $GITHUB_ENV
          echo 'CORS_ORIGINS=${{ secrets.PROD_CORS_ALLOWED_ORIGINS || secrets.CORS_ALLOWED_ORIGINS }}' >> $GITHUB_ENV
        else
          echo "ENV_NAME=staging" >> $GITHUB_ENV
          echo "REPO_NAME=tindahannatin-server-staging" >> $GITHUB_ENV
          echo 'DB_CONN=${{ secrets.STAGING_POSTGRES_CONNECTION_STRING || secrets.POSTGRES_CONNECTION_STRING }}' >> $GITHUB_ENV
          echo 'REDIS_CONN=${{ secrets.STAGING_REDIS_CONNECTION_STRING || secrets.REDIS_CONNECTION_STRING }}' >> $GITHUB_ENV
          echo 'SIGNALR_CONN=${{ secrets.STAGING_SIGNALR_CONNECTION_STRING || secrets.SIGNALR_CONNECTION_STRING }}' >> $GITHUB_ENV
          echo 'R2_BUCKET=${{ secrets.STAGING_R2_BUCKET_NAME || secrets.R2_BUCKET_NAME }}' >> $GITHUB_ENV
          echo 'AUTH0_DOM=${{ secrets.STAGING_AUTH0_DOMAIN || secrets.AUTH0_DOMAIN }}' >> $GITHUB_ENV
          echo 'AUTH0_AUD=${{ secrets.STAGING_AUTH0_AUDIENCE || secrets.AUTH0_AUDIENCE }}' >> $GITHUB_ENV
          echo 'AUTH0_MGT_ID=${{ secrets.STAGING_AUTH0_MANAGEMENT_CLIENT_ID || secrets.AUTH0_MANAGEMENT_CLIENT_ID }}' >> $GITHUB_ENV
          echo 'AUTH0_MGT_SEC=${{ secrets.STAGING_AUTH0_MANAGEMENT_CLIENT_SECRET || secrets.AUTH0_MANAGEMENT_CLIENT_SECRET }}' >> $GITHUB_ENV
          echo 'AUTH0_CLIENT_ID=${{ secrets.STAGING_AUTH0_CLIENT_ID || secrets.AUTH0_CLIENT_ID }}' >> $GITHUB_ENV
          echo 'CORS_ORIGINS=${{ secrets.STAGING_CORS_ALLOWED_ORIGINS || secrets.CORS_ALLOWED_ORIGINS }}' >> $GITHUB_ENV
        fi

    - name: Google Auth
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
        service_account: ${{ secrets.GCP_WIF_SA }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker
      run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
      working-directory: ./terraform

    - name: Terraform Select Workspace
      run: terraform workspace select ${{ env.ENV_NAME }} || terraform workspace new ${{ env.ENV_NAME }}
      working-directory: ./terraform

    - name: Terraform Import Existing Resources
      run: |
        STATE_LIST=$(terraform state list)
        
        if echo "$STATE_LIST" | grep -q "google_artifact_registry_repository.repo"; then
          echo "google_artifact_registry_repository.repo is already in state."
        else
          if [ "$TF_VAR_environment" = "prod" ]; then
            REPO_NAME="tindahannatin-server"
          else
            REPO_NAME="tindahannatin-server-$TF_VAR_environment"
          fi
          echo "Attempting to import google_artifact_registry_repository.repo..."
          terraform import google_artifact_registry_repository.repo "projects/$TF_VAR_project_id/locations/$TF_VAR_region/repositories/$REPO_NAME" || true
        fi
        
        if echo "$STATE_LIST" | grep -q "cloudflare_r2_bucket.products"; then
          echo "cloudflare_r2_bucket.products is already in state."
        else
          if [ "$TF_VAR_environment" = "prod" ]; then
            BUCKET_NAME="$TF_VAR_r2_bucket_name"
          else
            BUCKET_NAME="${TF_VAR_r2_bucket_name}-$TF_VAR_environment"
          fi
          echo "Attempting to import cloudflare_r2_bucket.products..."
          terraform import cloudflare_r2_bucket.products "$TF_VAR_cloudflare_account_id/$BUCKET_NAME" || true
        fi
        
        if echo "$STATE_LIST" | grep -q "cloudflare_r2_bucket.backups"; then
          echo "cloudflare_r2_bucket.backups is already in state."
        else
          if [ "$TF_VAR_environment" = "prod" ]; then
            BACKUP_BUCKET_NAME="${TF_VAR_r2_bucket_name}-backups"
          else
            BACKUP_BUCKET_NAME="${TF_VAR_r2_bucket_name}-${TF_VAR_environment}-backups"
          fi
          echo "Attempting to import cloudflare_r2_bucket.backups..."
          terraform import cloudflare_r2_bucket.backups "$TF_VAR_cloudflare_account_id/$BACKUP_BUCKET_NAME" || true
        fi
        
        if echo "$STATE_LIST" | grep -q "google_cloud_run_v2_service.server"; then
          echo "google_cloud_run_v2_service.server is already in state."
        else
          if [ "$TF_VAR_environment" = "prod" ]; then
            SERVICE_NAME="tindahannatin-server"
          else
            SERVICE_NAME="tindahannatin-server-$TF_VAR_environment"
          fi
          echo "Attempting to import google_cloud_run_v2_service.server..."
          terraform import google_cloud_run_v2_service.server "projects/$TF_VAR_project_id/locations/$TF_VAR_region/services/$SERVICE_NAME" || true
        fi
        
        if echo "$STATE_LIST" | grep -q "google_cloud_run_v2_service_iam_member.public_access"; then
          echo "google_cloud_run_v2_service_iam_member.public_access is already in state."
        else
          if [ "$TF_VAR_environment" = "prod" ]; then
            SERVICE_NAME="tindahannatin-server"
          else
            SERVICE_NAME="tindahannatin-server-$TF_VAR_environment"
          fi
          echo "Attempting to import google_cloud_run_v2_service_iam_member.public_access..."
          terraform import google_cloud_run_v2_service_iam_member.public_access "projects/$TF_VAR_project_id/locations/$TF_VAR_region/services/$SERVICE_NAME roles/run.invoker allUsers" || true
        fi
      working-directory: ./terraform
      env:
        TF_VAR_environment: ${{ env.ENV_NAME }}
        TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
        TF_VAR_region: ${{ env.GCP_REGION }}
        TF_VAR_image_tag: ${{ github.sha }}
        TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        TF_VAR_postgres_connection_string: ${{ env.DB_CONN }}
        TF_VAR_redis_connection_string: ${{ env.REDIS_CONN }}
        TF_VAR_signalr_connection_string: ${{ env.SIGNALR_CONN }}
        TF_VAR_r2_access_key: ${{ secrets.R2_ACCESS_KEY }}
        TF_VAR_r2_secret_key: ${{ secrets.R2_SECRET_KEY }}
        TF_VAR_auth0_domain: ${{ env.AUTH0_DOM }}
        TF_VAR_auth0_audience: ${{ env.AUTH0_AUD }}
        TF_VAR_auth0_management_client_id: ${{ env.AUTH0_MGT_ID }}
        TF_VAR_auth0_management_client_secret: ${{ env.AUTH0_MGT_SEC }}
        TF_VAR_auth0_client_id: ${{ env.AUTH0_CLIENT_ID }}
        TF_VAR_r2_bucket_name: ${{ env.R2_BUCKET }}
        TF_VAR_cors_allowed_origins: ${{ env.CORS_ORIGINS }}

    - name: Terraform Apply Infrastructure
      run: terraform apply -target=google_artifact_registry_repository.repo -target=cloudflare_r2_bucket.products -target=cloudflare_r2_bucket.backups -auto-approve
      working-directory: ./terraform
      env:
        TF_VAR_environment: ${{ env.ENV_NAME }}
        TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
        TF_VAR_region: ${{ env.GCP_REGION }}
        TF_VAR_image_tag: ${{ github.sha }}
        TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        TF_VAR_postgres_connection_string: ${{ env.DB_CONN }}
        TF_VAR_redis_connection_string: ${{ env.REDIS_CONN }}
        TF_VAR_signalr_connection_string: ${{ env.SIGNALR_CONN }}
        TF_VAR_r2_access_key: ${{ secrets.R2_ACCESS_KEY }}
        TF_VAR_r2_secret_key: ${{ secrets.R2_SECRET_KEY }}
        TF_VAR_auth0_domain: ${{ env.AUTH0_DOM }}
        TF_VAR_auth0_audience: ${{ env.AUTH0_AUD }}
        TF_VAR_auth0_management_client_id: ${{ env.AUTH0_MGT_ID }}
        TF_VAR_auth0_management_client_secret: ${{ env.AUTH0_MGT_SEC }}
        TF_VAR_auth0_client_id: ${{ env.AUTH0_CLIENT_ID }}
        TF_VAR_r2_bucket_name: ${{ env.R2_BUCKET }}
        TF_VAR_cors_allowed_origins: ${{ env.CORS_ORIGINS }}

    - name: Publish Container
      run: |
        dotnet publish TindahanNatin.Server/TindahanNatin.Server.csproj \
          -c Release \
          -t:PublishContainer \
          -p:ContainerRegistry=${{ env.GCP_REGION }}-docker.pkg.dev \
          -p:ContainerRepository=${{ env.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }} \
          -p:ContainerImageTag=${{ github.sha }}

    - name: Install EF Tool
      run: dotnet tool install --global dotnet-ef

    - name: Database Backup
      run: |
        CONN_STR="${{ env.DB_CONN }}"
        
        extract_val() {
          echo "$CONN_STR" | grep -oEi "$1=[^;]+" | cut -d'=' -f2
        }
        
        HOST=$(extract_val "Host" || extract_val "Server")
        DB=$(extract_val "Database")
        USER=$(extract_val "Username" || extract_val "User Id")
        PASS=$(extract_val "Password")
        
        export PGPASSWORD="$PASS"
        BACKUP_FILE="backup-$(date +%Y%m%d%H%M%S).sql.gz"
        
        echo "Starting backup of $DB from $HOST..."
        pg_dump -h "$HOST" -U "$USER" -d "$DB" | gzip > "$BACKUP_FILE"
        
        # Determine the backup bucket name based on the environment
        BACKUP_BUCKET="${{ env.R2_BUCKET }}-backups"
        if [ "${{ env.ENV_NAME }}" != "prod" ]; then
          BACKUP_BUCKET="${{ env.R2_BUCKET }}-${{ env.ENV_NAME }}-backups"
        fi
        
        echo "Uploading $BACKUP_FILE to R2 bucket $BACKUP_BUCKET..."
        aws s3 cp "$BACKUP_FILE" "s3://$BACKUP_BUCKET/$BACKUP_FILE" \
          --endpoint-url "https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
          --region auto
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}

    - name: Update Database
      run: |
        dotnet ef database update \
          --project TindahanNatin.Server/TindahanNatin.Server.csproj \
          --connection "${{ env.DB_CONN }}"

    - name: Terraform Apply
      run: terraform apply -auto-approve
      working-directory: ./terraform
      env:
        TF_VAR_environment: ${{ env.ENV_NAME }}
        TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
        TF_VAR_region: ${{ env.GCP_REGION }}
        TF_VAR_image_tag: ${{ github.sha }}
        TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        TF_VAR_postgres_connection_string: ${{ env.DB_CONN }}
        TF_VAR_redis_connection_string: ${{ env.REDIS_CONN }}
        TF_VAR_signalr_connection_string: ${{ env.SIGNALR_CONN }}
        TF_VAR_r2_access_key: ${{ secrets.R2_ACCESS_KEY }}
        TF_VAR_r2_secret_key: ${{ secrets.R2_SECRET_KEY }}
        TF_VAR_auth0_domain: ${{ env.AUTH0_DOM }}
        TF_VAR_auth0_audience: ${{ env.AUTH0_AUD }}
        TF_VAR_auth0_management_client_id: ${{ env.AUTH0_MGT_ID }}
        TF_VAR_auth0_management_client_secret: ${{ env.AUTH0_MGT_SEC }}
        TF_VAR_auth0_client_id: ${{ env.AUTH0_CLIENT_ID }}
        TF_VAR_r2_bucket_name: ${{ env.R2_BUCKET }}
        TF_VAR_cors_allowed_origins: ${{ env.CORS_ORIGINS }}

